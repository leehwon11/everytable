spring.application.name=everytable_back

# 원본 everytable 은 Oracle(ojdbc) + 세션 인증을 사용했지만
# webjjang_back 참고 프로젝트 구조에 맞춰 MariaDB + JPA + JWT 로 전환.
server.port=80

spring.datasource.driverClassName=org.mariadb.jdbc.Driver

spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/everytable}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# DDL(update)이 엔티티에서 테이블을 자동 생성하므로 schema.sql/data.sql은 자동 실행하지 않는다.
# (MariaDB 등 외장 DB에서는 spring.sql.init.mode 기본값이 never라 별도 설정 불필요)
# resources/schema-reference.sql, resources/seed-data.sql 은 참고용 문서이며,
# 최초 1회 앱을 실행해 테이블을 만든 뒤 필요하면 수동으로 실행한다.

# DB DDL 자동 생성 옵션 - update: 변경분만 반영, 데이터 유지(개발용)
# 운영 전환 시 validate 또는 none 으로 변경 권장
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT 시크릿 키 (32바이트 이상). 운영 배포 전 반드시 별도 값으로 교체할 것.
springboot.jwt.secret=${JWT_SECRET:}

# 파일 업로드 설정 (원본 web.xml의 multipart-config 대응)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.file-size-threshold=1MB

# 공지사항 이미지 등 업로드 파일 저장 폴더 (FileStorageService, WebConfig에서 공용으로 사용)
# 폴더가 없으면 앱이 자동으로 만든다. 운영 환경에서는 반드시 외부 경로로 바꿀 것.
app.upload.dir=C:/Temp/upload


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
mail.from.address=${spring.mail.username}
mail.from.name=everytable
